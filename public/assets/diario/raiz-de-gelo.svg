<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 760">
  <!-- Raiz-de-gelo: esboço de campo de Soren (diário, Prólogo II). Tinta sépia, aguada azul só na raiz. -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.54  0 0 0 0 0.43  0 0 0 0 0.29  0 0 0 0.10 0" />
    </filter>
    <filter id="tremor" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="2" seed="3" result="t" />
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="aguada" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9dcec" stop-opacity="0.85" />
      <stop offset="0.55" stop-color="#7fb4d1" stop-opacity="0.75" />
      <stop offset="1" stop-color="#4f8db3" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="corte" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d6ecf5" />
      <stop offset="1" stop-color="#6fa7c8" />
    </radialGradient>
    <!-- Folha lanceolada com nervura e geada na borda (base na origem, ponta para cima) -->
    <g id="folha">
      <path d="M0 0C-12-18-15-50-2-88C10-52 12-20 0 0Z" fill="#e9dfc2" stroke="#3b2a1c" stroke-width="1.4" />
      <path d="M0-2C-1-30-1-60-2-86" fill="none" stroke="#3b2a1c" stroke-width="0.8" />
      <path d="M-1-20l-7-6M-1-36l-8-7M-1-52l-7-7M0-28l7-7M0-44l7-8M-1-62l6-7" fill="none" stroke="#3b2a1c" stroke-width="0.55" stroke-opacity="0.7" />
      <path d="M-9-40l-3-1M-11-56l-3 0M9-34l3-1M8-58l3-1M-6-72l-3-1" fill="none" stroke="#5f97ba" stroke-width="1.1" stroke-linecap="round" />
    </g>
    <!-- Cristal de gelo de seis pontas -->
    <g id="cristal" stroke="#2f6f96" stroke-width="1.1" stroke-linecap="round" fill="none">
      <path d="M0-7V7M-6-3.5L6 3.5M-6 3.5L6-3.5" />
      <path d="M0-5l-2-2M0-5l2-2M0 5l-2 2M0 5l2 2" stroke-width="0.7" />
    </g>
  </defs>

  <rect width="600" height="760" fill="#efe4c6" />
  <rect width="600" height="760" filter="url(#papel)" />

  <g filter="url(#tremor)" fill="none" stroke="#3b2a1c" stroke-linecap="round" stroke-linejoin="round">
    <!-- Linha do solo e terra -->
    <path d="M110 302C170 298 230 305 290 300M318 301C380 297 440 304 492 300" stroke-width="1.4" />
    <path d="M140 312l-8 9M172 310l-7 8M205 314l-8 9M238 311l-6 8M352 312l-7 9M386 310l-8 9M420 313l-6 8M452 311l-7 8M180 326l-5 6M410 327l-5 6M262 322l-6 7M340 323l-6 7" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Caule -->
    <path d="M300 300C303 262 296 222 301 176C302 166 300 158 300 150" stroke-width="2.4" />

    <!-- Folhas: roseta rente ao solo e folhas menores ao longo do caule -->
    <use href="#folha" xlink:href="#folha" transform="translate(296 299) rotate(-72) scale(1.55)" />
    <use href="#folha" xlink:href="#folha" transform="translate(298 299) rotate(-44) scale(1.8)" />
    <use href="#folha" xlink:href="#folha" transform="translate(299 299) rotate(-16) scale(1.5)" />
    <use href="#folha" xlink:href="#folha" transform="translate(301 299) rotate(18) scale(1.45)" />
    <use href="#folha" xlink:href="#folha" transform="translate(302 299) rotate(46) scale(1.75)" />
    <use href="#folha" xlink:href="#folha" transform="translate(304 299) rotate(74) scale(1.5)" />
    <use href="#folha" xlink:href="#folha" transform="translate(299 226) rotate(-36) scale(0.8)" />
    <use href="#folha" xlink:href="#folha" transform="translate(301 198) rotate(32) scale(0.7)" />

    <!-- Broto cristalino no topo -->
    <polygon points="300,128 311,134 311,147 300,153 289,147 289,134" fill="#cfe6f1" stroke-width="1.4" />
    <path d="M300 128V153M289 134L311 147M311 134L289 147" stroke-width="0.6" stroke="#4f8db3" />

    <!-- Raiz principal com aguada azul -->
    <path d="M277 305C266 338 287 364 276 400C267 440 291 456 281 500C272 546 293 582 294 630C296 670 300 692 301 714C305 690 308 656 312 616C320 572 301 530 318 482C331 442 311 420 323 380C331 346 315 326 325 305Z" fill="url(#aguada)" stroke-width="2.2" />
    <path d="M285 338c10 4 22 4 32-1M282 382c12 5 25 4 35-2M283 432c11 5 24 4 34-1M281 488c10 5 22 4 31-1M286 548c9 4 19 4 27-1M292 606c7 3 14 3 20-1M296 660c4 2 8 2 11 0" stroke-width="0.9" stroke-opacity="0.75" />
    <path d="M296 320C293 380 302 440 296 500C292 560 300 620 300 690" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" />

    <!-- Raízes secundárias e radicelas -->
    <path d="M283 360C250 378 228 412 204 462" stroke-width="1.8" />
    <path d="M228 412c-14 2-26 0-38-6M215 440c-10 8-15 18-17 30M245 386c-8-10-20-14-32-14" stroke-width="0.9" />
    <path d="M318 402C350 420 376 456 396 508" stroke-width="1.8" />
    <path d="M366 444c14-4 26-2 37 4M384 478c11 6 17 15 19 27M342 418c6-10 16-16 28-18" stroke-width="0.9" />
    <path d="M281 474C254 502 240 542 228 594" stroke-width="1.5" />
    <path d="M246 530c-12 0-22-4-31-11M236 566c-9 7-13 16-14 26" stroke-width="0.8" />
    <path d="M311 544C334 566 351 602 360 642" stroke-width="1.4" />
    <path d="M343 590c11-3 21-1 30 5M352 616c8 6 12 13 13 22" stroke-width="0.8" />
    <path d="M296 640C284 660 278 680 276 702M304 662c10 14 14 28 15 42" stroke-width="1" />
    <!-- Pelos da raiz -->
    <path d="M279 420l-6-2M278 455l-6 1M282 520l-6-1M290 590l-6 1M318 470l6-1M317 500l6 1M313 580l6-2M307 630l5 1" stroke-width="0.6" stroke-opacity="0.7" />

    <!-- Corte transversal da raiz, ligado por linha pontilhada -->
    <path d="M318 512C360 520 395 532 424 548" stroke-width="1" stroke-dasharray="2 5" />
    <circle cx="482" cy="566" r="60" stroke-width="1.6" fill="#efe4c6" />
    <circle cx="482" cy="566" r="46" fill="url(#corte)" stroke-width="1.4" />
    <circle cx="482" cy="566" r="24" stroke-width="1" stroke="#2f5f80" />
    <polygon points="482,542 503,554 503,578 482,590 461,578 461,554" stroke="#2f5f80" stroke-width="1" />
    <path d="M482 542V590M461 554L503 578M503 554L461 578" stroke="#2f5f80" stroke-width="0.7" />
    <path d="M436 566h-6M534 566h-6M482 516v-6M482 622v-6" stroke-width="0.9" />

    <!-- Escala -->
    <path d="M70 716H170M70 710v12M95 712v8M120 710v12M145 712v8M170 710v12" stroke-width="1.1" />
  </g>

  <!-- Cristais de gelo presos na raiz, no corte e no broto -->
  <use href="#cristal" xlink:href="#cristal" transform="translate(292 352) scale(0.75)" />
  <use href="#cristal" xlink:href="#cristal" transform="translate(305 430) scale(0.7)" />
  <use href="#cristal" xlink:href="#cristal" transform="translate(290 510) scale(0.75)" />
  <use href="#cristal" xlink:href="#cristal" transform="translate(304 590) scale(0.6)" />
  <use href="#cristal" xlink:href="#cristal" transform="translate(526 520) scale(0.9)" />
  <use href="#cristal" xlink:href="#cristal" transform="translate(318 132) scale(0.65)" />
</svg>
